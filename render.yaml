# render.yaml — Render.com deployment config for RAG & Retrieval Studio
# Docs: https://render.com/docs/blueprint-spec

services:
  - type: web
    name: rag-retrieval-studio
    runtime: python
    region: oregon
    plan: free

    # Build: install Node, build React, then install Python deps
    buildCommand: |
      curl -fsSL https://deb.nodesource.com/setup_20.x | bash - &&
      apt-get install -y nodejs &&
      cd frontend && npm ci && npm run build && cd .. &&
      pip install -r requirements.txt

    # Start: launch the unified FastAPI server
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT

    # Health check endpoint
    healthCheckPath: /api/health

    # Environment variables
    envVars:
      - key: PORT
        value: 10000
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: SEMANTIC_SCHOLAR_API_KEY
        value: ""

    # Persistent disk to survive restarts (paid feature)
    # Uncomment to enable corpus persistence across restarts:
    # disk:
    #   name: corpus-store
    #   mountPath: /opt/render/project/src/corpus_store
    #   sizeGB: 1
